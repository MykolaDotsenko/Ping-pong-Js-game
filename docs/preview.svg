<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">Ping Pong Architecture Lab preview</title>
  <desc id="desc">Dark application shell with a Ping Pong canvas and architecture notes.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="0%" r="75%">
      <stop offset="0" stop-color="#12302f"/>
      <stop offset=".45" stop-color="#08111f"/>
      <stop offset="1" stop-color="#050a12"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#000" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="1200" height="820" fill="url(#bg)"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="120" y="68" font-size="14" font-weight="700" letter-spacing="2" fill="#5eead4">VANILLA JAVASCRIPT · ARCHITECTURE SHOWCASE</text>
    <text x="120" y="126" font-size="52" font-weight="800" fill="#f8fafc">Ping Pong Architecture Lab</text>
    <text x="120" y="165" font-size="18" fill="#94a3b8">A deliberately small browser game with explicit domain, application, and adapter boundaries.</text>

    <rect x="105" y="210" width="990" height="405" rx="24" fill="#0f172a" fill-opacity=".94" stroke="#334155" filter="url(#shadow)"/>
    <text x="135" y="254" font-size="25" font-weight="700" fill="#f8fafc">Match</text>
    <text x="135" y="282" font-size="15" fill="#94a3b8">You 2 — 1 Computer</text>

    <g font-size="15" font-weight="700">
      <g opacity=".45">
        <rect x="825" y="232" width="78" height="38" rx="10" fill="#2dd4bf"/>
        <text x="846" y="257" fill="#05201d">Start</text>
      </g>
      <rect x="914" y="232" width="82" height="38" rx="10" fill="#2dd4bf"/>
      <text x="930" y="257" fill="#05201d">Pause</text>
      <rect x="1007" y="232" width="70" height="38" rx="10" fill="none" stroke="#475569"/>
      <text x="1020" y="257" fill="#e2e8f0">Reset</text>
    </g>

    <rect x="135" y="305" width="930" height="235" rx="16" fill="#09111f" stroke="#23484e"/>
    <line x1="135" y1="422" x2="1065" y2="422" stroke="#526071" stroke-width="2" stroke-dasharray="12 14"/>
    <text x="155" y="398" font-family="ui-monospace,monospace" font-size="30" font-weight="700" fill="#f1f5f9">1</text>
    <text x="155" y="464" font-family="ui-monospace,monospace" font-size="30" font-weight="700" fill="#f1f5f9">2</text>
    <rect x="500" y="324" width="112" height="14" rx="3" fill="#f8fafc"/>
    <rect x="690" y="512" width="112" height="14" rx="3" fill="#f8fafc"/>
    <circle cx="650" cy="450" r="8" fill="#5eead4"/>
    <text x="140" y="575" font-size="14" fill="#94a3b8"><tspan fill="#cbd5e1" font-weight="700">Move:</tspan> pointer/touch, ← →, A D</text>
    <text x="430" y="575" font-size="14" fill="#94a3b8"><tspan fill="#cbd5e1" font-weight="700">Start / pause:</tspan> Space</text>
    <text x="615" y="575" font-size="14" fill="#94a3b8"><tspan fill="#cbd5e1" font-weight="700">Goal:</tspan> first to 7</text>

    <rect x="105" y="640" width="990" height="130" rx="24" fill="#0f172a" fill-opacity=".94" stroke="#334155"/>
    <text x="135" y="674" font-size="13" font-weight="700" letter-spacing="2" fill="#5eead4">ENGINEERING FOCUS</text>
    <text x="135" y="709" font-size="23" font-weight="750" fill="#f8fafc">Small product, explicit boundaries</text>
    <text x="565" y="674" font-size="16" fill="#e2e8f0">• Domain: <tspan fill="#94a3b8">scoring, collisions, paddle rules, AI strategy</tspan></text>
    <text x="565" y="709" font-size="16" fill="#e2e8f0">• Application: <tspan fill="#94a3b8">state transitions, fixed-timestep loop</tspan></text>
    <text x="565" y="744" font-size="16" fill="#e2e8f0">• Adapters: <tspan fill="#94a3b8">browser input, DOM view, Canvas, scheduler</tspan></text>
  </g>
</svg>
