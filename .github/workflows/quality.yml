name: Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint, type-check, unit tests with coverage gate, structure checks
        run: npm run check

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npm run test:e2e

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  # The site is static and served straight from the repository root, so a
  # deploy is just a copy of the runtime files. It only happens on main, and
  # only after both check jobs above are green for that commit.
  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [quality, browser-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Assemble the static site
        run: |
          mkdir site
          cp -r index.html style.css script.js favicon.png manifest.webmanifest src icons site/
          find site -type f | sort

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      # A deploy can "succeed" and still change nothing when the Pages source
      # in the repository settings is a branch instead of GitHub Actions, so
      # print the configuration and prove the live site serves this commit.
      - name: Report the Pages configuration
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '{build_type, status, source, html_url}'

      - name: Verify the live site serves this commit
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          expected=$(grep -o '<title>[^<]*</title>' index.html)
          for attempt in 1 2 3 4 5 6; do
            served=$(curl -fsSL "${PAGE_URL}?deployed=${GITHUB_SHA}" | grep -o '<title>[^<]*</title>' || true)
            echo "attempt ${attempt}: ${served:-no title}"
            if [ "${served}" = "${expected}" ]; then
              echo "Live: ${PAGE_URL}"
              exit 0
            fi
            sleep 10
          done
          echo "::error::${PAGE_URL} still serves an older build. In Settings > Pages the source must be 'GitHub Actions'."
          exit 1
