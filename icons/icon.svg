  <line x1="92" y1="256" x2="420" y2="256" stroke="#c4b5fd" stroke-opacity="0.55" stroke-width="6" stroke-dasharray="22 18"/>
  <rect x="176" y="112" width="160" height="26" rx="13" fill="#f472b6" filter="url(#glow)"/>
  <rect x="200" y="374" width="160" height="26" rx="13" fill="#22d3ee" filter="url(#glow)"/>
  <path d="M190 340 L292 222" stroke="url(#trail)" stroke-width="30" stroke-linecap="round"/>
  <circle cx="300" cy="212" r="70" fill="url(#aura)"/>
  <circle cx="300" cy="212" r="24" fill="#ffffff"/>
